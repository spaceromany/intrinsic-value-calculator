name: 주식 데이터 크롤링

# 크롤링을 웹 호스트가 아닌 GitHub Actions에서 돌린다.
# 결과는 Supabase Storage로 올라가고 웹앱은 그것을 읽기만 하므로,
# 웹 호스트의 대역폭 사용량은 실제 사용자 트래픽만 남는다.
#
# 두 가지 모드로 돈다.
#   주가 전용 : 장중에 자주. KRX 목록 응답 하나로 전 종목 시세가 오므로
#               추가 네트워크 요청이 0회고 1~2분이면 끝난다.
#   전체      : 하루 한 번. 재무지표(EPS·BPS)와 NCAV까지 갱신한다.
on:
  schedule:
    # ── 주가 전용 ──────────────────────────────────────────
    # 평일 01:25~06:25 UTC = 10:25~15:25 KST. 정규장(09:00~15:30) 중
    # 매시간. 상류 데이터(fdr의 KRX 목록)가 30~60분마다 갱신되므로
    # 이보다 자주 돌려도 같은 값만 다시 받는다.
    # 정각을 피한 이유: GitHub의 스케줄 큐는 :00에 가장 붐벼서 지연이 크다.
    - cron: '25 1-6 * * 1-5'

    # ── 전체 ───────────────────────────────────────────────
    # 평일 09:40 UTC = 18:40 KST. 상류가 18:2x~18:3x KST에 그날의 마지막
    # 갱신(확정 종가)을 올리므로 그 뒤에 돌려야 종가가 확정값이 된다.
    # 장 마감 직후(16:00 KST)에 돌리면 15:2x 스냅샷을 종가로 기록하게 된다.
    - cron: '40 9 * * 1-5'
  workflow_dispatch:  # 수동 실행
    inputs:
      price_only:
        description: '주가만 갱신 (재무지표·NCAV 건너뜀)'
        type: boolean
        default: false

# 이전 실행이 아직 돌고 있으면 새로 시작하지 않는다.
# 같은 데이터를 두 프로세스가 동시에 업로드하면 서로 덮어쓴다.
# 주가 전용과 전체가 같은 파일을 쓰므로 그룹을 나누지 않는다.
concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest

    # 시크릿이 저장소 레벨이 아니라 이 환경 안에 등록되어 있다.
    # 환경 시크릿은 job이 environment를 선언해야만 주입되므로 이 줄이 없으면
    # secrets.SUPABASE_URL 등이 전부 빈 값이 된다.
    # (DART_API_KEY는 여기서 시크릿 이름이 아니라 '환경'의 이름이다)
    environment: DART_API_KEY

    # 시간 예산(2700+900초)보다 넉넉히 잡되, 폭주 시 과금을 막는 상한
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          # 기본값은 requirements.txt(웹앱용)를 해싱한다. 크롤러가 설치하는
          # 파일을 기준으로 캐시해야 웹앱 의존성만 바뀌었을 때 캐시가
          # 헛되이 무효화되지 않는다.
          cache-dependency-path: requirements-crawl.txt

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-crawl.txt

      - name: 크롤링 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # 크롤러는 Storage에 쓰기를 하므로 service_role 키를 쓴다.
          # storage.py가 SERVICE_KEY를 우선 사용하고, 없으면 anon 키로 폴백한다.
          # 이 매핑이 없으면 저장소 시크릿에 키가 있어도 프로세스에 전달되지
          # 않아 조용히 anon 키로 동작한다.
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}

          # 장중 스케줄(cron '25 1-6')이면 주가만 갱신한다.
          # 수동 실행은 입력값을 따르고, 그 외(전체 스케줄)는 전체로 돈다.
          PRICE_ONLY: >-
            ${{ (github.event.schedule == '25 1-6 * * 1-5'
                 || inputs.price_only) && '1' || '0' }}

          # 한 실행이 너무 오래 돌지 않게 자르는 상한. 종목은 오래된 순으로
          # 처리되므로 중단돼도 다음 실행이 남은 종목부터 이어받는다.
          # (공개 저장소라 GitHub 호스팅 러너 사용 시간은 무제한이다.
          #  비공개로 전환하면 Free 플랜 기준 월 2,000분 한도가 생긴다.)
          CRAWL_BUDGET_SECONDS: '2700'
          NCAV_BUDGET_SECONDS: '900'
          # EPS·BPS는 분기 데이터라 매일 긁을 이유가 없다.
          FUNDAMENTALS_REFRESH_SECONDS: '604800'
          CRAWL_WORKERS: '6'
          # NCAV는 DART 사업보고서 기반이라 연 1회만 바뀐다.
          NCAV_REFRESH_SECONDS: '2592000'
          NCAV_WORKERS: '6'
        run: python crawl.py
