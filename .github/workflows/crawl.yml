name: 주식 데이터 크롤링

# 크롤링을 웹 호스트가 아닌 GitHub Actions에서 돌린다.
# 결과는 Supabase Storage로 올라가고 웹앱은 그것을 읽기만 하므로,
# 웹 호스트의 대역폭 사용량은 실제 사용자 트래픽만 남는다.
on:
  schedule:
    # 평일 07:00 UTC = 16:00 KST. 장 마감(15:30) 직후 하루 한 번.
    # 내재가치는 EPS/BPS 기반이라 분기마다 바뀌고, 장중에 움직이는 건
    # 주가뿐이다. 종가 기준 하루 1회면 가치평가 도구로 충분하다.
    - cron: '0 7 * * 1-5'
  workflow_dispatch:  # 수동 실행

# 이전 실행이 아직 돌고 있으면 새로 시작하지 않는다.
# 같은 데이터를 두 프로세스가 동시에 업로드하면 서로 덮어쓴다.
concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest

    # 시크릿이 저장소 레벨이 아니라 이 환경 안에 등록되어 있다.
    # 환경 시크릿은 job이 environment를 선언해야만 주입되므로 이 줄이 없으면
    # secrets.SUPABASE_URL 등이 전부 빈 값이 된다.
    # (DART_API_KEY는 여기서 시크릿 이름이 아니라 '환경'의 이름이다)
    environment: DART_API_KEY

    # 시간 예산(2700+900초)보다 넉넉히 잡되, 폭주 시 과금을 막는 상한
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 크롤링 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          # 실행당 소요 시간을 제한해 Actions 무료 분(private repo 월 2,000분)을
          # 넘기지 않게 한다. 종목은 오래된 순으로 처리되므로 중단돼도
          # 다음 실행이 남은 종목부터 이어받는다.
          CRAWL_BUDGET_SECONDS: '2700'
          NCAV_BUDGET_SECONDS: '900'
          STOCK_REFRESH_SECONDS: '3600'
        run: python crawl.py
